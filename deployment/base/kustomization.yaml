apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - feature-flags.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app: agent
      component: agent

images:
  - name: ghcr.io/redhat-data-and-ai/template-agent
    newTag: latest
