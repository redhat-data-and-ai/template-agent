apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
data:
  CONFIG_PATH: "/app/config/agent"
  AGENT_HOST: "0.0.0.0"
  AGENT_PORT: "5002"
  PYTHON_LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  REQUEST_BODY_MAX_SIZE: "10485760"  # 10MB
