apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
type: Opaque
stringData:
  # PostgreSQL credentials (default for in-cluster deployment)
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"

  # SSO / OIDC Authentication
  SSO_ISSUER_URL: ""
  SSO_CLIENT_ID: ""
  SSO_CLIENT_SECRET: ""

  # Langfuse (optional - external service)
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
  LANGFUSE_BASE_URL: ""

  # Google Vertex AI (optional)
  GOOGLE_APPLICATION_CREDENTIALS_CONTENT: ""

  # vLLM / OpenAI-compatible (optional)
  VLLM_BASE_URL: ""
  VLLM_API_KEY: ""

  # Shared secret between agent pod and eval runner — generate with: openssl rand -hex 32
  # EVAL_INTERNAL_TOKEN: <required — overlay or operator must supply a non-empty value>

  # NOTE: MCP_TOKEN_ENCRYPTION_KEY is deliberately NOT here.
  #
  # This Secret is overlay-managed, so `kubectl apply -k` rewrites
  # every key in it. An encryption key that gets reset to "" on the
  # next deploy is worse than no key: tokens encrypted with the old
  # one become unreadable. It lives in its own Secret that nothing
  # re-applies — see deployment/README or the agent deployment env.
