# With scale-to-zero the Route must target the KEDA interceptor, not the
# agent Service. Pointing at the agent directly returns 503 at zero
# replicas — nothing is listening, and nothing triggers a scale-up.
#
# The interceptor accepts the connection, holds it while KEDA scales the
# Deployment, then forwards.
#
# Pointed at the local ExternalName Service, not at the interceptor
# directly: a Route resolves only Services in its own namespace, and
# the interceptor lives in `keda`, so naming it here left the Route
# with no backend and a 503.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: agent
spec:
  to:
    kind: Service
    name: keda-interceptor-proxy
  port:
    targetPort: 8080
