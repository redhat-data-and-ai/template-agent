apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - deployment.yaml
  - service.yaml
  - policies-configmap.yaml
  - configmap.yaml
  - secret.yaml

patches:
  - target:
      kind: ConfigMap
      name: agent-config
    patch: |-
      - op: add
        path: /data/OPA_URL
        value: "http://opa:8181/v1/data/agent/authz"
