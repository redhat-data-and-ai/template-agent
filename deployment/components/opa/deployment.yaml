apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  labels:
    component: opa
spec:
  replicas: 1
  selector:
    matchLabels:
      component: opa
  template:
    metadata:
      labels:
        component: opa
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opa
          image: ghcr.io/redhat-data-and-ai/template-agent-opa:latest
          ports:
            - containerPort: 8181
              name: http
              protocol: TCP
          env:
            - name: OPA_POLICY_GIT_REPO
              valueFrom:
                configMapKeyRef:
                  name: opa-config
                  key: OPA_POLICY_GIT_REPO
            - name: OPA_POLICY_GIT_BRANCH
              valueFrom:
                configMapKeyRef:
                  name: opa-config
                  key: OPA_POLICY_GIT_BRANCH
            - name: OPA_POLICY_GIT_SUBDIR
              valueFrom:
                configMapKeyRef:
                  name: opa-config
                  key: OPA_POLICY_GIT_SUBDIR
            - name: OPA_POLICY_GIT_SSL_VERIFY
              valueFrom:
                configMapKeyRef:
                  name: opa-config
                  key: OPA_POLICY_GIT_SSL_VERIFY
            - name: OPA_POLL_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: opa-config
                  key: OPA_POLL_INTERVAL
            - name: OPA_POLICY_GIT_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: opa-secrets
                  key: OPA_POLICY_GIT_AUTH_USER
            - name: OPA_POLICY_GIT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opa-secrets
                  key: OPA_POLICY_GIT_AUTH_TOKEN
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/opa
                - eval
                - "true"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/opa
                - eval
                - "true"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: opa-policies
              mountPath: /policies
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: opa-policies
          configMap:
            name: opa-policies
      restartPolicy: Always
