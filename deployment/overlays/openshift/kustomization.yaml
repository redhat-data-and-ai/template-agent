apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: NAMESPACE_PLACEHOLDER

resources:
  - ../../base
  - route.yaml
  - pdb.yaml
  - hpa.yaml
  - opa-deployment.yaml
  - opa-service.yaml
  - opa-pdb.yaml
  - opa-policies-configmap.yaml
  - opa-configmap.yaml
  - opa-secret.yaml

patches:
  - target:
      kind: Deployment
      name: agent
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"

  # OPA resource limits
  - target:
      kind: Deployment
      name: opa
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"

  # Add OPA_URL to agent config
  - target:
      kind: ConfigMap
      name: agent-config
    patch: |-
      - op: add
        path: /data/OPA_URL
        value: "http://opa:8181/v1/data/agent/authz"
