apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: NAMESPACE_PLACEHOLDER

resources:
  - ../../base
  - buildconfig.yaml
  - imagestream.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - pdb.yaml
  - servicemonitor.yaml
  - hpa.yaml
  - eval-runner-buildconfig.yaml
  - eval-runner-imagestream.yaml
  - eval-runner-scaledobject.yaml

components:
  - ../../components/postgres
  - ../../components/redis
  # opa: disabled in values.yaml
  - ../../components/eval-runner
  # scaleToZero: disabled in values.yaml
  # externalChannels: disabled in values.yaml
  - ../../components/documents-pvc
  - ../../components/config-pvc

labels:
  - pairs:
      app: agent
      component: agent

images:
  - name: agent
    newTag: latest

patches:
  # Values from config/agent/deployment/values.yaml. Generated — see
  # scripts/render_deployment.py. Hand-written patches below it cover
  # structure, which values.yaml deliberately does not describe.
  - path: generated.yaml
  - path: configmap-patch.yaml
  - path: secret-patch.yaml

  # PostgreSQL deployment patches (from base)
  - target:
      kind: Deployment
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: add
        path: /spec/template/spec/containers/0/args
        value: ["-c", "max_connections=200"]

  # PostgreSQL PVC size (OpenShift gets more storage)
  - target:
      kind: PersistentVolumeClaim
      name: postgres-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: "10Gi"

  # Redis deployment patches (from base)
  - target:
      kind: Deployment
      name: redis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"

  # Redis PVC size (OpenShift gets more storage)
  - target:
      kind: PersistentVolumeClaim
      name: redis-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: "2Gi"

  # Eval-runner deployment patches (KEDA: start at 0 replicas, scale on HTTP traffic)
  - path: eval-runner-deployment-patch.yaml
    target:
      kind: Deployment
      name: eval-runner
