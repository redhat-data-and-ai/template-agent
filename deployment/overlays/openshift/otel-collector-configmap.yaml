apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: agent
    component: otel-collector
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1000

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        const_labels:
          source: "otel-collector"
      debug:
        verbosity: normal
      # Add trace exporter here if needed (e.g., otlp/jaeger, otlp/tempo)
      # For production, consider using a managed tracing backend

    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus, debug]
        traces:
          receivers: [otlp]
          processors: [batch]
          # Only debug exporter for now - add proper trace backend when needed
          exporters: [debug]
