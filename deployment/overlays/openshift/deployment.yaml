apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    app: agent
    component: agent
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agent
      component: agent
  template:
    metadata:
      labels:
        app: agent
        component: agent
    spec:
      serviceAccountName: agent
      terminationGracePeriodSeconds: 60
      # Migrations run once, before any app pod starts. With replicas > 1
      # and the startup hook enabled, every replica queues on Alembic's
      # advisory lock and later pods are killed by the kubelet when they
      # miss their probe deadline.
      initContainers:
        - name: db-migrate
          image: agent:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/aegra", "db", "upgrade"]
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: POSTGRES_PASSWORD
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "500m"
      containers:
        - name: agent
          image: agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
              name: http
              protocol: TCP
          env:
            - name: AGENT_HOST
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: AGENT_HOST
            - name: AGENT_PORT
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: AGENT_PORT
            - name: ENABLE_AUTH
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: ENABLE_AUTH
            - name: PYTHON_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: PYTHON_LOG_LEVEL
            - name: LANGFUSE_TRACING_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: LANGFUSE_TRACING_ENVIRONMENT
            # Corporate root CAs, fetched at container start and
            # appended to the system trust bundle by entrypoint.sh.
            # Internal MCP servers and any internal HTTPS dependency
            # fail the TLS handshake without it.
            #
            # `optional: true` so a fork with no corporate CA — or
            # one that prefers mounting a Secret via CUSTOM_CA_PATH —
            # still starts.
            - name: CUSTOM_CA_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: CUSTOM_CA_URL
                  optional: true
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: POSTGRES_PASSWORD
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: LANGFUSE_PUBLIC_KEY
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: LANGFUSE_SECRET_KEY
                  optional: true
            - name: LANGFUSE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: LANGFUSE_BASE_URL
                  optional: true
            - name: GOOGLE_APPLICATION_CREDENTIALS_CONTENT
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: GOOGLE_APPLICATION_CREDENTIALS_CONTENT
                  optional: true
            - name: SSO_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: SSO_ISSUER_URL
                  optional: true
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: SSO_CLIENT_ID
                  optional: true
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: SSO_CLIENT_SECRET
                  optional: true
            - name: VLLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: VLLM_BASE_URL
                  optional: true
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: VLLM_API_KEY
                  optional: true
            - name: EVAL_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: EVAL_INTERNAL_TOKEN
            - name: EVAL_TOKEN_REFRESH_ENABLED
              value: "true"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: REDIS_URL
            # This container has no envFrom, so a ConfigMap key that is not
            # named here never reaches the pod. Omitting it left Aegra on its
            # own default of false and crash recovery inert in preprod/prod.
            - name: REDIS_BROKER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: REDIS_BROKER_ENABLED
            - name: SSL_KEYFILE
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: SSL_KEYFILE
                  optional: true
            - name: SSL_CERTFILE
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: SSL_CERTFILE
                  optional: true
            - name: REQUEST_LOGGING_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: REQUEST_LOGGING_ENABLED
            - name: REQUEST_LOG_HEADERS
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: REQUEST_LOG_HEADERS
            - name: REQUEST_LOG_BODY
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: REQUEST_LOG_BODY
            - name: REQUEST_LOG_BODY_MAX_SIZE
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: REQUEST_LOG_BODY_MAX_SIZE
            - name: RUN_MIGRATIONS_ON_STARTUP
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: RUN_MIGRATIONS_ON_STARTUP
            - name: ENABLE_PROMETHEUS_METRICS
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: ENABLE_PROMETHEUS_METRICS
            # Where the documents volume is mounted, and the cap the
            # upload API enforces. Configured rather than read from
            # statvfs: that reports the *node* disk in Kind, so a
            # 500Mi claim would accept gigabytes and fail later at an
            # unrelated write.
            - name: DOCUMENTS_PATH
              value: "/app/data/documents"
            - name: DOCUMENTS_MAX_BYTES
              value: "524288000"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            # Documents, exposed to the agent at /documents/.
            # Writable at the mount: uploads arrive over HTTP from a
            # person. The *model* still cannot write — the filesystem
            # route is `filesystem_readonly` and the permission rules
            # deny write on `documents/**`. Human writes, model reads.
            - name: agent-documents
              mountPath: /app/data/documents
      volumes:
        - name: agent-documents
          persistentVolumeClaim:
            claimName: agent-documents-pvc
      restartPolicy: Always
