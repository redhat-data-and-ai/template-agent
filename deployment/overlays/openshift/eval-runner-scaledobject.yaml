apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eval-runner
  labels:
    app: eval-runner
    component: eval-runner
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eval-runner
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
