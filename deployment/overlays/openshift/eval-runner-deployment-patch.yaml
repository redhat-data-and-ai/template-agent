apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-runner
spec:
  replicas: 0
  template:
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: eval-runner
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
