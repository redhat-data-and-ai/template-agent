apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-runner
spec:
  replicas: 1
  template:
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: eval-runner
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          env:
            - name: EVAL_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: EVAL_INTERNAL_TOKEN
                  optional: true
            - name: EVAL_TOKEN_REFRESH_ENABLED
              value: "true"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
