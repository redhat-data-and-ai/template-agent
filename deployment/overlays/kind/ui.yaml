apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels:
    app: template-agent
    component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      component: ui
  template:
    metadata:
      labels:
        app: template-agent
        component: ui
    spec:
      containers:
        - name: ui
          image: localhost/template-ui:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: "development"
            - name: AUTH_ENABLED
              value: "false"
            # Required by the server, which refuses to start without a
            # 32-character value — the UI had never started on Kind
            # because nothing set it. A fixed literal is correct here and
            # only here: Kind is a throwaway local cluster, the cookies
            # it signs never leave the laptop, and a generated value
            # would invalidate every session on each redeploy. The
            # OpenShift overlay takes this from a Secret.
            - name: COOKIE_SIGN
              value: "kind-local-development-cookie-signing-key"
            - name: AGENT_HOST
              value: "http://agent:5002"
            - name: UI_CONFIG_PATH
              value: "/etc/config/ui.yaml"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: REDIS_PORT
          volumeMounts:
            - name: ui-config
              mountPath: /etc/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              # The BFF buffers a whole multipart upload in memory
              # (Fastify `parseAs: 'buffer'`), so the ceiling has to
              # clear the upload cap with room for Node's baseline and
              # a second concurrent request. At 256Mi a 60 MB upload
              # OOMKilled the pod, which surfaced as nginx 503 and
              # "the agent didn't respond" — blaming the agent for a
              # UI that was not running.
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: ui-config
          configMap:
            name: ui-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-config
  labels:
    app: template-agent
    component: ui
data:
  ui.yaml: |
    # The name and mark are config, never constants in code. The
    # mounted ConfigMap is what the UI actually reads, so omitting
    # branding here left the masthead on its generic fallback while
    # the repo's own config/ui/settings.yaml said Workpilot.
    branding:
      title: "Workpilot"
      logo_url: "https://cdn.prod.website-files.com/6447ad3a38d5f03bc4e0a3b2/69e9fcfe18543c02af4fde56_WorkPilot.jpg"
      favicon_url: "https://cdn.prod.website-files.com/6447ad3a38d5f03bc4e0a3b2/69e9fcfe18543c02af4fde56_WorkPilot.jpg"
    server:
      host: "0.0.0.0"
      port: 8080
      body_limit: 1048576
    logging:
      level: info
    cors:
      origin: "http://localhost:5173"
    security:
      helmet:
        enabled: true
        csp:
          default_src: ["'self'"]
          script_src: ["'self'", "'unsafe-inline'"]
          style_src: ["'self'", "'unsafe-inline'"]
          img_src: ["'self'", "data:", "blob:"]
          connect_src: ["'self'"]
          font_src: ["'self'"]
          object_src: ["'none'"]
          frame_ancestors: ["'none'"]
        cross_origin_embedder_policy: false
      rate_limit:
        enabled: true
        # Matches template-ui's own default. A chat UI is chattier
        # than a REST client — one analytics page load is four calls
        # — and 100/min fired during ordinary use.
        max: 600
        window: "1 minute"
        # One hop: nginx-ingress in Kind, the Route in OpenShift.
        # Without it every request carries the ingress pod's address
        # and the whole deployment shares a single bucket.
        trust_proxy: 1
        exclude_paths:
          - "/api/health"
          - "/_health"
      session:
        secure_cookie: false
        max_age_days: 30
    otel:
      enabled: false
      service_name: "template-ui"
    announcement:
      enabled: false
      message: ""
      type: info
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    app: template-agent
    component: ui
spec:
  selector:
    component: ui
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  type: ClusterIP
