apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels:
    app: template-agent
    component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      component: ui
  template:
    metadata:
      labels:
        app: template-agent
        component: ui
    spec:
      containers:
        - name: ui
          image: localhost/template-ui:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: "development"
            - name: AUTH_ENABLED
              value: "false"
            # Required by the server, which refuses to start without a
            # 32-character value — the UI had never started on Kind
            # because nothing set it. A fixed literal is correct here and
            # only here: Kind is a throwaway local cluster, the cookies
            # it signs never leave the laptop, and a generated value
            # would invalidate every session on each redeploy. The
            # OpenShift overlay takes this from a Secret.
            - name: COOKIE_SIGN
              value: "kind-local-development-cookie-signing-key"
            - name: AGENT_HOST
              value: "http://agent:5002"
            - name: UI_CONFIG_PATH
              value: "/etc/config/ui.yaml"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: REDIS_PORT
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              subPath: ui
              readOnly: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              # The BFF buffers a whole multipart upload in memory
              # (Fastify `parseAs: 'buffer'`), so the ceiling has to
              # clear the upload cap with room for Node's baseline and
              # a second concurrent request. At 256Mi a 60 MB upload
              # OOMKilled the pod, which surfaced as nginx 503 and
              # "the agent didn't respond" — blaming the agent for a
              # UI that was not running.
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  labels:
    app: template-agent
    component: ui
spec:
  selector:
    component: ui
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  type: ClusterIP
