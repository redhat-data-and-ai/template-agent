apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    app: agent
    component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
      component: agent
  template:
    metadata:
      labels:
        app: agent
        component: agent
    spec:
      containers:
        - name: agent
          image: agent:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
              name: http
              protocol: TCP
          env:
            - name: AGENT_HOST
              value: "0.0.0.0"
            - name: AGENT_PORT
              value: "5002"
            - name: PYTHON_LOG_LEVEL
              value: "INFO"
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: REDIS_URL
            - name: EVAL_RUNNER_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: EVAL_RUNNER_URL
                  optional: true
            - name: GOOGLE_APPLICATION_CREDENTIALS_CONTENT
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: GOOGLE_APPLICATION_CREDENTIALS_CONTENT
                  optional: true
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: LANGFUSE_PUBLIC_KEY
                  optional: true
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: LANGFUSE_SECRET_KEY
                  optional: true
            - name: LANGFUSE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: LANGFUSE_BASE_URL
                  optional: true
            - name: LANGFUSE_TRACING_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: LANGFUSE_TRACING_ENVIRONMENT
                  optional: true
            # --- Daytona code sandbox (optional; unset = disabled) ---
            - name: DAYTONA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: DAYTONA_API_KEY
                  optional: true
            - name: DAYTONA_API_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DAYTONA_API_URL
                  optional: true
            - name: DAYTONA_TARGET
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DAYTONA_TARGET
                  optional: true
            - name: DAYTONA_RUNTIME
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DAYTONA_RUNTIME
                  optional: true
            - name: DAYTONA_CPU
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DAYTONA_CPU
                  optional: true
            - name: DAYTONA_MEMORY_GB
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DAYTONA_MEMORY_GB
                  optional: true
            - name: DAYTONA_DISK_GB
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DAYTONA_DISK_GB
                  optional: true
            - name: DAYTONA_AUTO_STOP_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DAYTONA_AUTO_STOP_MINUTES
                  optional: true
            - name: DAYTONA_AUTO_DELETE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DAYTONA_AUTO_DELETE_MINUTES
                  optional: true
            - name: DAYTONA_IDLE_REAP_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DAYTONA_IDLE_REAP_MINUTES
                  optional: true
            - name: DAYTONA_MAX_SANDBOXES
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DAYTONA_MAX_SANDBOXES
                  optional: true
            - name: DAYTONA_DOMAIN_ALLOW_LIST
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DAYTONA_DOMAIN_ALLOW_LIST
                  optional: true
            - name: DAYTONA_NETWORK_BLOCK_ALL
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DAYTONA_NETWORK_BLOCK_ALL
                  optional: true
            - name: DAYTONA_ALLOW_ANONYMOUS_SESSION
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DAYTONA_ALLOW_ANONYMOUS_SESSION
                  optional: true
            - name: DAYTONA_LOG_COMMANDS
              valueFrom:
                configMapKeyRef:
                  name: agent-config
                  key: DAYTONA_LOG_COMMANDS
                  optional: true
          startupProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          # /live is the cheap liveness endpoint — no Postgres/checkpointer/store
          # round-trips, unlike /health. Dependency failures belong to readiness.
          livenessProbe:
            httpGet:
              path: /live
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always
