apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: NAMESPACE_PLACEHOLDER

resources:
  - ../../base
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - scaledobject.yaml

labels:
  - pairs:
      app: agent
      component: agent-headless

images:
  - name: agent
    newTag: latest

patches:
  - path: configmap-patch.yaml
  - path: secret-patch.yaml
  - path: redis-patch.yaml
