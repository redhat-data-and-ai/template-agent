language: en-US
tone_instructions: >-
  Be extremely concise. Only flag bugs, security issues, and logic errors.
  Skip style nits, naming suggestions, and minor refactors.
  Avoid em dashes in review comments.
  One sentence per comment. No pleasantries.
early_access: true

reviews:
  profile: chill
  request_changes_workflow: false
  base_branches:
    - main
    - deep-agent
    - rc-.*
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  poem: false
  review_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  assess_linked_issues: true
  abort_on_close: true
  auto_review:
    enabled: true
  path_filters:
    - "!**/*.md"
    - "!**/*.txt"
    - "!**/*.lock"
    - "!**/.gitignore"
    - "!**/LICENSE"
    - "!.env*"
  path_instructions:
    - path: "deep_agent/**/*.py"
      instructions: >-
        Focus on correctness and performance: race conditions in async code,
        missing awaits, unhandled exceptions, type mismatches, security flaws,
        N+1 queries, blocking calls in async contexts, unnecessary copies of
        large objects, missing connection/session reuse, and unbounded list
        growth. Skip style and naming feedback.
    - path: "tests/**/*.py"
      instructions: >-
        Only flag tests that would silently pass when they should fail,
        missing assertions, or incorrect async usage.
    - path: "Containerfile"
      instructions: >-
        Flag security issues only: secrets in layers, running as root,
        or missing OpenShift compatibility.
    - path: ".github/workflows/**"
      instructions: >-
        Flag unpinned actions, overly broad permissions, and secret leaks.
        Skip cosmetic suggestions.
    - path: "deployment/**"
      instructions: >-
        Flag missing resource limits, privileged containers, and missing
        security contexts.
    - path: "config/**"
      instructions: >-
        Flag hardcoded secrets, insecure defaults, and missing validation.
    - path: "compose.yaml"
      instructions: >-
        Flag exposed ports, missing health checks, and hardcoded credentials.
    - path: "entrypoint.sh"
      instructions: >-
        Flag missing error handling (set -e), unsafe variable expansion,
        and command injection risks.
    - path: "pyproject.toml"
      instructions: >-
        Flag unpinned dependencies and known vulnerable version ranges.
  tools:
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
