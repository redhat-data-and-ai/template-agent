[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deep_agent"]

[tool.hatch.build.targets.wheel.force-include]
"deep_agent/src/memory/memory_instructions.j2" = "deep_agent/src/memory/memory_instructions.j2"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "template-agent"
version = "0.2.0"
description = "A template for Model Context Protocol (MCP) server development"
readme = "README.md"
keywords = ["mcp", "template", "server"]
requires-python = ">=3.12.2"
dependencies = [
    "deepagents==0.7.24",
    # Document parsing for attachments and the knowledge corpus. Without
    # these, extraction silently returns empty text and a PDF uploads
    # "successfully" with nothing indexed.
    "pypdf==6.20.1",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "langchain-google-genai==4.4.1",
    "langchain-google-vertexai==3.2.4",
    "langchain-openai==1.7.1",
    "langchain-mcp-adapters==0.3.2",
    "mcp==1.30.0",
    "langfuse==4.17.0",
    "langgraph==1.2.14",
    "langgraph-checkpoint-postgres==3.1.2",
    "langgraph-sdk==0.4.6",
    "aegra-api==0.10.8",
    "aegra-cli==0.10.8",
    "psycopg[binary,pool]==3.3.6",
    "psycopg2-binary==2.9.13",
    "motor==3.7.1",
    "structlog==26.1.0",
    "pyyaml==6.0.3",
    "PyJWT[crypto]==2.15.1",
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "redis==8.1.0",
    "cachetools==7.2.1",
    "presidio-analyzer==2.2.364",
    "spacy==3.8.16",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "litellm==1.105.0",
    "aiokafka==0.14.0",
    "msgpack==1.2.3",
    "ldap3==2.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.2.1",
    "pytest-mock==3.16.0",
    "ruff==0.17.0",
    "mypy==1.16.1",
    "pre-commit==4.6.2",
    "httpx==0.28.1",
]

[project.urls]
Homepage = "https://github.com/redhat-data-and-ai/template-agent"
Repository = "https://github.com/redhat-data-and-ai/template-agent"
Issues = "https://github.com/redhat-data-and-ai/template-agent/issues"

[dependency-groups]
dev = [
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.2.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
lint.select = ["E", "W", "F", "I", "F401"]
lint.ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = ["eval-runner/"]
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
markers = [
    "asyncio",
    "unit: fast isolated unit tests",
    "integration: tests requiring external services or multi-component interaction",
    "skills: marks tests as skill evaluation tests (deselect with '-m \"not skills\"')",
    "e2e: end-to-end tests requiring a running aegra server",
    "slow: tests that take more than 30 seconds",
    "contract: pins a cross-repo or cross-version interface; runs per PR",
    "nightly: needs a running stack (Kind/OpenShift); too slow for per-PR",
]

[tool.coverage.run]
source = ["deep_agent"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
