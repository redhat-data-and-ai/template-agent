# Granite Guardian guardrails
#
# Guardrails activate automatically when GUARDIAN_API_BASE is set.
# Remove or leave GUARDIAN_API_BASE unset to disable.
#
# model: Guardian model served by your vLLM / OpenAI-compatible endpoint.

model: ibm-granite/granite-guardian-3.2-5b

# Credentials — set via Agentforge platform UI (stored in Vault, injected at deploy):
#   GUARDIAN_API_BASE   — endpoint URL (required to activate guardrails)
#   GUARDIAN_API_KEY    — API key ("EMPTY" for unauthenticated endpoints)
#   GUARDIAN_SSL_VERIFY — true/false, default true (set false only for local dev)
