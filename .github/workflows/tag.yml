name: Tag Pre-Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Create pre-release tag
        run: |
          DATE=$(date -u +%Y.%m.%d)
          LATEST=$(git tag --list "v${DATE}-rc.*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            NEXT=1
          else
            CURRENT=$(echo "$LATEST" | sed "s/v${DATE}-rc\.//")
            NEXT=$((CURRENT + 1))
          fi
          TAG="v${DATE}-rc.${NEXT}"
          git tag "$TAG"
          git push origin "$TAG"
