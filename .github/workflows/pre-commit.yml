name: Pre-commit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.12"

jobs:
  pre-commit:
    name: Pre Commit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Full history so gitleaks can scan the tree/history in CI
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up virtual env
      run: uv venv --python ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        uv pip install -e ".[dev]"

    - name: Run Pre Commit
      run: |
        source .venv/bin/activate && pre-commit run --all-files

    # The gitleaks pre-commit hook runs `gitleaks git --pre-commit --staged`,
    # which only scans staged changes. A clean CI checkout has nothing staged,
    # so run a full-tree detect here as well.
    - name: Gitleaks full-tree scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
