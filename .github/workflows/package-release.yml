name: Package Release

# Appends eval-runner image info to the GitHub Release created by build-base-image.
# workflow_run cannot filter on tags, so the job-level if skips branch builds and
# auto RC tags from Tag Pre-Release (vYYYY.MM.DD-rc.N). Version tags are
# channel-semver, e.g. dev-1.0.7.
on:
  workflow_run:
    workflows: ["Build and Push Base Image"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  package:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dev-')
    runs-on: ubuntu-latest

    steps:
      - name: Determine build context
        id: ctx
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          SHORT_SHA="${HEAD_SHA::7}"

          # Version tags: dev-1.0.7 (not v2.1.3 or vYYYY.MM.DD-rc.N)
          if echo "$HEAD_BRANCH" | grep -qE '^dev-[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "is_tag=true"            >> $GITHUB_OUTPUT
            echo "version=${HEAD_BRANCH}" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false"                         >> $GITHUB_OUTPUT
            echo "version=${HEAD_BRANCH}-${SHORT_SHA}"  >> $GITHUB_OUTPUT
          fi
          echo "head_sha=${HEAD_SHA}" >> $GITHUB_OUTPUT

      - name: Download agent info artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: last-good-agent
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: agent-info

      - name: Read agent info
        id: agent
        run: |
          cat agent-info/release-info.json
          echo "image=$(jq -r '.container_image' agent-info/release-info.json)"  >> $GITHUB_OUTPUT
          echo "digest=$(jq -r '.container_digest' agent-info/release-info.json)" >> $GITHUB_OUTPUT
          echo "signed=$(jq -r '.signed' agent-info/release-info.json)"           >> $GITHUB_OUTPUT

      - name: Wait for eval build on same commit (tags only)
        if: steps.ctx.outputs.is_tag == 'true'
        id: eval-wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA="${{ steps.ctx.outputs.head_sha }}"
          TIMEOUT=900
          INTERVAL=30
          ELAPSED=0
          echo "Waiting for eval build on commit ${HEAD_SHA}..."
          while [ $ELAPSED -lt $TIMEOUT ]; do
            RUN=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/build-eval-image.yml/runs?head_sha=${HEAD_SHA}&per_page=1" \
              --jq '.workflow_runs[0] | {id: .id, status: .status, conclusion: .conclusion}' 2>/dev/null || echo "null")
            if [ "$RUN" != "null" ] && [ -n "$RUN" ]; then
              STATUS=$(echo "$RUN" | jq -r '.status')
              CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
              RUN_ID=$(echo "$RUN" | jq -r '.id')
              if [ "$STATUS" = "completed" ]; then
                echo "conclusion=${CONCLUSION}" >> $GITHUB_OUTPUT
                echo "run_id=${RUN_ID}"         >> $GITHUB_OUTPUT
                exit 0
              fi
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "conclusion=timed_out" >> $GITHUB_OUTPUT
          echo "run_id="              >> $GITHUB_OUTPUT

      - name: Download eval artifact (tags only)
        if: steps.ctx.outputs.is_tag == 'true' && steps.eval-wait.outputs.conclusion == 'success'
        id: eval-download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: last-good-eval
          run-id: ${{ steps.eval-wait.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: eval-info

      - name: Read eval info
        id: eval
        run: |
          if [ ! -f eval-info/last-good-eval.json ]; then
            echo "image="       >> $GITHUB_OUTPUT
            echo "digest="      >> $GITHUB_OUTPUT
            echo "available=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          cat eval-info/last-good-eval.json
          echo "image=$(jq -r '.container_image' eval-info/last-good-eval.json)"    >> $GITHUB_OUTPUT
          echo "digest=$(jq -r '.container_digest' eval-info/last-good-eval.json)"   >> $GITHUB_OUTPUT
          echo "available=true" >> $GITHUB_OUTPUT

      - name: Build release body section
        if: steps.ctx.outputs.is_tag == 'true'
        id: body
        run: |
          AVAILABLE="${{ steps.eval.outputs.available }}"
          IMAGE="${{ steps.eval.outputs.image }}"
          DIGEST="${{ steps.eval.outputs.digest }}"

          if [ "$AVAILABLE" = "true" ]; then
            BODY="## Eval Runner Image

          \`\`\`bash
          docker pull ${IMAGE}
          \`\`\`

          **Digest:** \`${DIGEST}\`"
          else
            BODY="## Eval Runner Image ⚠️ build unavailable

          No successful eval build found for this release commit."
          fi

          # Use multiline delimiter for GITHUB_OUTPUT
          {
            echo "content<<BODY_EOF"
            echo "$BODY"
            echo "BODY_EOF"
          } >> $GITHUB_OUTPUT

      - name: Update GitHub Release with eval-runner info (tags only)
        if: steps.ctx.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ steps.ctx.outputs.version }}
          append_body: true
          body: ${{ steps.body.outputs.content }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
