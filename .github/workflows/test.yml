name: Tests

on:
  push:
    branches: [ main, deep-agent ]
  pull_request:
    branches: [ main, deep-agent ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Python with uv
      uses: ./.github/actions/setup-python-uv
      with:
        python-version: "3.14"

    - name: Run unit tests with coverage
      env:
        GOOGLE_APPLICATION_CREDENTIALS_CONTENT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_CONTENT }}
      run: |
        source .venv/bin/activate && pytest tests/unit -m "not e2e" --cov=deep_agent --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=68 --junitxml=test-results.xml

    - name: Test summary
      if: always()
      continue-on-error: true
      run: |
        if [ -f test-results.xml ]; then
          echo "### Test Results (Python 3.14)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          TESTS=$(grep -oP 'tests="\K[^"]+' test-results.xml | head -1)
          FAILURES=$(grep -oP 'failures="\K[^"]+' test-results.xml | head -1)
          ERRORS=$(grep -oP 'errors="\K[^"]+' test-results.xml | head -1)
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${TESTS:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failures | ${FAILURES:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| Errors | ${ERRORS:-0} |" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload coverage reports to Codecov
      if: always()
      continue-on-error: true
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
