## Agent compose stack — agent + dependencies only (no MCP, no UI)
##
##   make local      - pgvector + redis in compose; agent process on host
##   make container  - pgvector + redis + agent in compose
##   make dev        - same as container, detached + log tail
##
## MCP and UI run from their own repos (template-mcp-server, template-ui).

services:
  pgvector:
    image: ankane/pgvector
    container_name: template-agent-pgvector
    environment:
      POSTGRES_DB: template_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - agent_pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d template_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agent-network

  redis:
    image: redis:7-alpine
    container_name: template-agent-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - agent_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - agent-network

  template-agent:
    profiles: [container]
    build:
      context: .
      dockerfile: Containerfile
    container_name: template-agent
    extra_hosts:
      - "host.containers.internal:host-gateway"
    ports:
      - "5002:5002"
    env_file:
      - .env
    environment:
      - ENABLE_AUTH=true
      - POSTGRES_HOST=pgvector
      - POSTGRES_PORT=5432
      - POSTGRES_DB=template_agent
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
      - REDIS_BROKER_ENABLED=true
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./deep_agent:/app/deep_agent:ro
      - ./config:/app/config:ro
    networks:
      - agent-network

volumes:
  agent_pgvector_data:
    driver: local
  agent_redis_data:
    driver: local

networks:
  agent-network:
    driver: bridge
