- name: officialproductlist
  database: officialproductlist_db
  schema: marts
  maturity: ai_experimental
  category: source-aligned
  description: Official Product List serves as the official corporate product catalog for Red Hat. This data product maintains
    authoritative information about Red Hat products, including product attributes, aliases, components, market lifecycle,
    partners, portfolios, and references.
  route_when:
  - Queries about Red Hat product catalog, product attributes, product types, product portfolios, product aliases, product
    components, product market lifecycle (release/EOL dates), product partners, product references, or official product list.
  - '"Product catalog"** / **"Official product list"** / **"Product attributes"** → **Official Product List**'
  - '"Product lifecycle"** (reference dates, market lifecycle in catalog) / **"Product EOL"** / **"Product release date"**
    → **Official Product List**'
  - '"Product portfolio"** / **"Product type"** / **"Product alias"** → **Official Product List**'
  - '"Product partners"** / **"Product references"** → **Official Product List**'
  do_not_route:
  - OLM**, **offering lifecycle**, **SKU leverage**, **inactivation candidates**, **SKU ARR on the OLM mart**, **quoting tier**,
    **subscription coverage on OLM** → Use **Offering Lifecycle Management (OLM)**
  primary_use_cases:
  - Product master data (core product attributes, status)
  - Product aliases (alternate names)
  - Product components
  - Product market lifecycle (release dates, end-of-life)
  - Product-portfolio mapping
- name: offeringlifecyclemgmt
  database: offeringlifecyclemgmt_db
  schema: marts
  maturity: ai_experimental
  category: source-aligned
  description: 'Offering Lifecycle Management (OLM) provides a unified **SKU-level** view of Red Hat offering lifecycle status:
    catalog attributes, MSRP, offering taxonomy, pipeline-derived activeness, subscription coverage, leverage and inactivation
    signals, and current/prior-quarter commercial metrics (ARR/ACV/TCV-style) for lifecycle decisions.'
  route_when:
  - Queries about **OLM**, **offering lifecycle**, **SKU** performance or lifecycle status, **MSRP** on the OLM mart, **quoting
    tier**, leveraged/unleveraged SKUs, latest-closed-quarter ARR at SKU grain, subscription coverage on the mart, or offering-group/line
    analytics.
  - '"OLM"** / **"offering lifecycle"** / **"leveraged SKU"** / **"inactivation candidate"** → **OLM**'
  - '"TSTT"** / **"too-soon"** / **"new SKU"** classification → **OLM**'
  - '"Latest closed quarter ARR"** at SKU grain (OLM context) → **OLM**'
  - '"Product catalog"** without SKU lifecycle metrics → **Official Product List**'
  - '"ASP"** / **"average selling price"** → **Offering Performance Analytics (OPA)**'
  do_not_route:
  - Corporate product catalog** (aliases, components, reference lifecycle without OLM mart metrics) → **Official Product List**
  - Parent/child SKU hierarchy**, counting children per parent, or `REFERENCED_MDM_ID` lookups → **MDMPRODUCT**
  - Opportunity- or account-centric pipeline** beyond SKU rollups → **Bookingsmaster**
  - Recognized GL revenue** → **RevenueMaster**
  - Deal net price / CPQ discounts** → **Discounting** or transactional products as appropriate
  - Enterprise-unique customer counts** by summing SKU-level customer fields → Not supported on this mart
  - Average Selling Price (ASP)** / price per unit / entitled units → **Offering Performance Analytics (OPA)**
  primary_use_cases:
  - Corporate product catalog** (aliases, components, reference lifecycle without OLM mart metrics) → **Official Product List**
  - Parent/child SKU hierarchy**, counting children per parent, or `REFERENCED_MDM_ID` lookups → **MDMPRODUCT**
  - Opportunity- or account-centric pipeline** beyond SKU rollups → **Bookingsmaster**
  - Recognized GL revenue** → **RevenueMaster**
  - Deal net price / CPQ discounts** → **Discounting** or transactional products as appropriate
- name: offeringperformanceanalytics
  database: offeringperformanceanalytics_db
  schema: marts
  maturity: ai_experimental
  category: source-aligned
  description: Offering Performance Analytics (OPA) provides **Average Selling Price (ASP)** analytics across RHEL, Ansible,
    OpenShift, and Application Services (entitlement-based unit economics, channel-adjusted transfer price, and product-level
    ASP summary) plus **product cohort retention analysis** (ANSIBLE, OPENSHIFT, RHEL).
  route_when:
  - Queries about **ASP**, **average selling price**, **average sales price**, **price per unit**, **price per core**, **price
    per socket**, **price per node**, **entitled units**, **channel adjustment**, **transfer price**, **RHEL ASP**, **OpenShift
    ASP**, **Ansible ASP**, **App Services ASP**, **ELS/EUS** pricing impact, **bare metal ASP**, **product cohort**, **cohort
    analysis**, **cohort quarter**, **first active**, **net-new customers** by cohort, **cohort ARR**, or **average entry
    ARR**.
  - '"ASP"** / **"average selling price"** / **"price per core"** / **"entitled units"** → **Offering Performance Analytics
    (OPA)**'
  - '"Product cohort"** / **"cohort analysis"** / **"cohort quarter"** / **"first active"** / **"net-new customers" by cohort**
    / **"cohort ARR"** / **"average entry ARR"** → `OFFERINGPERFORMANCEANALYTICS_DB.MARTS.PRODUCT_COHORT_ANALYSIS`'
  - ASP / ARC / GRR / NRR** → **not** `product_cohort_analysis`
  do_not_route:
  - Pipeline, forecast categories, MJ tags, bookings targets** → Use **Forecasting**
  - General bookings / ARR / ACV without ASP or cohort context** → Use **Bookingsmaster**
  - Recognized/actual/GL revenue** → Use **RevenueMaster**
  - Discount analysis (MSRP vs TCV)** → Use **Discounting**
  - OLM offering lifecycle / SKU leverage** → Use **OLM**
  - SKU master / product hierarchy** → Use **MDMPRODUCT**
  primary_use_cases:
  - Pipeline, forecast categories, MJ tags, bookings targets** → Use **Forecasting**
  - General bookings / ARR / ACV without ASP or cohort context** → Use **Bookingsmaster**
  - Recognized/actual/GL revenue** → Use **RevenueMaster**
  - Discount analysis (MSRP vs TCV)** → Use **Discounting**
  - OLM offering lifecycle / SKU leverage** → Use **OLM**
  disambiguation: OPA (Offering Performance Analytics) is for product cohort retention, net-new customers by cohort quarter,
    customer retention ARR, ASP (average selling price), price per unit/core/socket, ELS/EUS ASP, bare metal ASP.
