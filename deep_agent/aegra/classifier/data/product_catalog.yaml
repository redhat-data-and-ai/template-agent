- name: orders
  database: orders_db
  schema: orders_marts
  maturity: unknown
  category: source-aligned
  description: Orders is the source-aligned Oracle EBS Order Management (ONT) data product. It is the analytics-ready warehouse
    for the full sales-order lifecycle — headers, lines, holds, pricing adjustments, transaction types, additional parties,
    and inbound XML integration logs. OrderAnalytics is a narrow GBD reporting layer built on this product; generic EBS order
    questions belong here.
  route_when:
  - Queries about EBS sales orders, order headers, order lines, order holds, booked/open/cancelled orders, order numbers,
    order status / flow status, operating unit orders, ship-to / sold-to / invoice-to on orders, payment terms or freight
    on orders, order transaction types, order pricing adjustments, order integration / XML logs, ONT order management, or
    `orders_db` explicitly.
  do_not_route:
  - GBD / Autobook / In Region / Web / LMS / Bill Training IE reporting** → Use **OrderAnalytics** instead (built on Orders;
    GBD-scope only)
  - Bookings, ARR, ACV, pipeline, opportunities** → Use **Bookingsmaster** instead
