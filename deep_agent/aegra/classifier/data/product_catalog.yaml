- name: hginsights
  database: hginsights_db
  schema: marts
  maturity: unknown
  category: source-aligned
  description: The HG Insights data product provides comprehensive competitive intelligence and IT spend data to enable data-driven
    marketing and sales strategies. This data product consolidates **technographic information** about hardware/software installations
    and IT spending patterns across the market. This is **third-party data** sourced by scraping and processing billions of
    publicly available digital docum
  route_when:
  - Queries about **IT spend and IT budgets** by technology category (comparing between companies, NOT specific product/vendor
    spend)
  - Queries about **non-Red Hat software/hardware usage** and adoption (cloud products, partner products)
  - 'TAM/Market analysis**: "market penetration", "industries with high IT spend", "companies not using Red Hat"'
  - 'Technographic data (market-wide)**: "companies using AWS/Azure/GCP", "multi-cloud strategy", "cloud migration" — when
    comparing **across the market**, not Red Hat internal ledger spend'
  - If asking about **comparing IT budgets/spend between companies** → **HG Insights**
  - If asking about **RHSC account information** (product flags, intent, competitive footprint) → **GTM** (uses `GTM_HG_INSIGHTS`
    for competitive/technographic data matched to RHSC accounts)
  - If asking "What did customers BUY from Red Hat?" → **Bookingsmaster** (sales data)
  - If asking about **Red Hat customers or Red Hat product analysis** → **Must use Bookingsmaster**, NOT HG Insights alone
  primary_use_cases:
  - Queries about **IT spend and IT budgets** by technology category (comparing between companies, NOT specific product/vendor
    spend)
  - Queries about **non-Red Hat software/hardware usage** and adoption (cloud products, partner products)
  - 'TAM/Market analysis**: "market penetration", "industries with high IT spend", "companies not using Red Hat"'
  - 'Technographic data (market-wide)**: "companies using AWS/Azure/GCP", "multi-cloud strategy", "cloud migration" — when
    comparing **across the market**, not Red Hat internal ledger spend'
- name: interestedparties
  database: interestedparties_db
  schema: marts
  maturity: ai_experimental
  category: source-aligned
  description: The Interested Parties data product captures relationships between Red Hat customer accounts and Jira engineering
    work items. Data originates from the Interested Parties Forge application, where Red Hat account teams link customers
    to Jira issues to indicate the customer is "affected by" or "interested in" that work. It serves as a pivot point connecting
    customer identity (via MDM Party ID) to eng
  route_when:
  - Queries about which customers are affected by or interested in a Jira issue, which issues a customer cares about, customer
    link counts per issue or project, audit trail of who linked a customer to an issue, customer impact on engineering work.
  - '"Which customers are affected by / interested in [issue]?"** → **Interested Parties**'
  - '"What issues does [customer] care about?"** → **Interested Parties**'
  - '"How many customers are waiting on [issue/project]?"** → **Interested Parties**'
  - '"Who linked [customer] to [issue]?"** → **Interested Parties** (audit trail in `FCT_LINK_TRANSACTIONS`)'
  - '"What is [customer]''s account segment/region?"** → **Rosettastone** (join via `customer_mdm_pk`)'
  - '"What is the status of [issue]?"** → **JIRA** (join via `issue_key`)'
  - '"What is the NPS / satisfaction / adoption score for customers affected by [issue]?"** → **Interested Parties** + **CxaHub**
    (via Rosettastone `RHSC_ACCT_ID`)'
  primary_use_cases:
  - Customer-to-Jira-issue link relationships (active and soft-deleted)
  - 'Link context: `affected_by` (customer hit by a bug/issue) or `interested_in` (customer wants a feature)'
  - Audit trail of all link create/update/delete operations with actor email and timestamps
  - 'Customer identifiers: `customer_mdm_pk` (MDM Party ID), `customer_name`'
  - 'Jira identifiers: `issue_key` (e.g., RHCLOUD-12345), `jira_project`'
