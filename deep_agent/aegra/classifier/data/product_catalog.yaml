- name: salesplanning
  database: salesplanning_db
  schema: marts
  maturity: ai_experimental
  category: source-aligned
  description: '**Schemas:** `QUARTERIZATION_MARTS`, `QUOTA_MARTS`'
  route_when:
  - Target Planning:** Queries about sales targets, quarterly targets, target allocation, target vs. actual comparison, planning
    targets, territory targets, or quarterization methods
  - Seller Quotas (Current Year):** Queries about **current fiscal year** individual seller quotas, quota assignments, quota
    by territory, quota by sales role, quota coverage, quota gap to minimum, or quota stacking
  - Restated Renewals:** Queries explicitly about restated renewals should route to **Sales Planning MARTS**
  - Current fiscal year quota queries** → **Sales Planning** (QUOTA_MARTS)
  - Past fiscal year quota queries** (historical quota data) → **SI Execution**
  - '"What are the sales targets for..."** → **Sales Planning** (sales target allocation data - bookings/ARR targets in QUARTERIZATION_MARTS)'
  - '"How did we perform vs. target..."** → **Sales Planning** (target vs. actual comparison for sales targets in QUARTERIZATION_MARTS)'
  - '"What is my quota this year..."** / **"Current year quota..."** / **"FY26 quota..."** → **Sales Planning** (current fiscal
    year quota in QUOTA_MARTS)'
  primary_use_cases:
  - Quarterization Marts:** Quarterly target allocation, target vs. actual analysis, geographic target distribution, CCSP
    (Cloud Computing Service Provider) target tracking, and sales plan period management
  - Quota Marts:** Individual seller quota assignments, quota vs. target analysis, seller territory coverage, quota gap analysis,
    and quota stacking scenarios
  key_tables:
  - QUARTERIZATION_MARTS
  - QUOTA_MARTS
  disambiguation: 'Sales Planning is for TARGET/QUOTA data: sales targets, quarterly targets, quota assignments, territory
    targets, quota coverage, quota gap analysis, quarterization. NOT for bookings (use bookingsmaster) or revenue (use revenuemaster).'
